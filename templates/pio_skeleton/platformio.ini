; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
build_flags = -lm
 -I ~/.platformio/packages/framework-mik32v2-sdk/shared/libs
 -I ~/.platformio/packages/framework-mik32v2-sdk/hal/peripherals/Include
 -march=rv32im_zicsr_zifencei
 -mabi=ilp32

[env:development-board-bootloader]
platform = MIK32
board = development-board
framework = framework-mik32v2-sdk
upload_protocol = custom
upload_command = ~/elbear_uploader/elbear_uploader $SOURCE --com=/dev/ttyUSB0
board_build.ldscript = spifi
; ограничение на занимаемый прошивкой объём памяти:
board_upload.maximum_size = 16000000
board_build.f_cpu = 32000000L
build_flags =
    -D MIK32
