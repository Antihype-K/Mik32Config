; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mik32v2-start

[env]
build_flags = -lm
 -I ~/.platformio/packages/framework-mik32v2-sdk/shared/libs
 -I ~/.platformio/packages/framework-mik32v2-sdk/hal/peripherals/Include
 -march=rv32im_zicsr_zifencei
 -mabi=ilp32

; Прошивка через elbear_uploader (python-скрипт по UART), используется по умолчанию.
[env:mik32v2-start]
platform = MIK32
board = start-mik32-v1
framework = framework-mik32v2-sdk
upload_protocol = custom
upload_command = python3 /home/antihype/elbear_uploader/elbear_uploader.py $SOURCE --com=/dev/ttyUSB0
board_build.ldscript = spifi
; ограничение на занимаемый прошивкой объём памяти:
board_upload.maximum_size = 16000000
board_build.f_cpu = 32000000L
build_flags =
    -lm
    -D MIK32
    ;-D I2C_SPLIT

; Прошивка/отладка через eljtag вместо elbear_uploader.
[env:mik32v2-dip]
platform = MIK32
board = mik32v2
framework = framework-mik32v2-sdk
debug_tool = ftdi
; ограничение на занимаемый прошивкой объём памяти:
board_upload.maximum_size = 16000000
board_build.f_cpu = 32000000L
build_flags =
    -lm
    -D MIK32
    ;-D I2C_SPLIT
