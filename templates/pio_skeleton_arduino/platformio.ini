; PlatformIO Project Configuration File — Arduino-ветка MIK32-Configurator
; (codegen/project/arduino_project_codegen.{h,cpp}).
;
; В отличие от templates/pio_skeleton/platformio.ini (C-ветка), сюда НЕ
; добавлены глобальные -I на ~/.platformio/packages/framework-mik32v2-sdk —
; lib/mik32_arduino_core (вендоренный docs/elron/elbear_arduino_bsp/cores/arduino,
; собственная вложенная копия HAL в mik32/hal) самодостаточен и НЕ должен
; смешиваться с установленным SDK: это два независимых вендоренных снэпшота
; HAL, возможно разных версий — одновременное подключение рискует коллизией
; имён/несовместимых структур (см. feedback_hal_snapshot_vs_installed в
; памяти ассистента). board_build.ldscript = spifi — тот же проверенный фикс
; entry point 0x80000000, что и в C/CMake-ветках (CLAUDE.md, баг 2026-10-21).

[platformio]
default_envs = mik32v2-start

[env:mik32v2-start]
platform = MIK32
board = start-mik32-v1
framework = framework-mik32v2-sdk
upload_protocol = custom
upload_command = python3 /home/antihype/elbear_uploader/elbear_uploader.py $SOURCE --com=/dev/ttyUSB0
board_build.ldscript = spifi
board_upload.maximum_size = 16000000
board_build.f_cpu = 32000000L
; LDF ищет провайдера #include <Arduino.h> среди найденных библиотек по
; авто-разбору заголовков; Arduino.h лежит на два уровня глубже корня
; библиотеки (lib/mik32_arduino_core/src/cores/arduino/Arduino.h), поэтому
; авто-разрешение зависимости не срабатывает ("Found N compatible libraries",
; но "No dependencies" — ни один .c/.cpp не компилируется, main() не
; определена, линковка падает: "undefined reference to `main'", найдено на
; реальной сборке 2026-10-26). lib_deps принудительно включает библиотеку
; независимо от авто-разрешения.
lib_deps = mik32_arduino_core
; PlatformIO автоопределение lib/* ожидает плоский src/ или заголовки прямо
; в корне lib/<name>/ — у вендоренного core два отдельных дерева
; (cores/arduino и variants/rex_board), поэтому include-пути перечислены
; явно (тот же набор, что compiler.MIK32_Amur.extra_include в
; docs/elron/elbear_arduino_bsp/platform.txt, строка 17, + сам core/вариант).
;
; ВАЖНО: cores/arduino/mik32/ (вложенная копия HAL+shared/libs из
; elbear_arduino_bsp) УДАЛЕНА из снэпшота полностью — framework-mik32v2-sdk
; принудительно собирает mik32_hal_adc.c/dac.c/dma.c/uart_lib.c/xprintf.c и
; т.п. из УЖЕ УСТАНОВЛЕННОГО пакета независимо от того, используется ли эта
; периферия в проекте; если вложенная копия (другой версии) попадала и в
; include-path, и компилировалась как часть lib/, получались то несовпадающие
; макросы регистров при сборке чужих файлов framework (другая версия заголовка
; подставлялась первой), то дублирующиеся символы на линковке (та же функция
; определена и в framework, и в нашей копии). Исправлено: Arduino-ядро
; использует ТОЛЬКО установленный framework-mik32v2-sdk как единственный
; источник HAL/shared-libs (как и C/Rust-ветки) — см.
; feedback_hal_snapshot_vs_installed в памяти ассистента, найдено на реальной
; сборке 2026-10-26.
build_flags =
    -lm
    -D MIK32
    ; F_CPU — используется HardwareSerial.cpp (расчёт BRR) и Tone.cpp;
    ; обычно подставляется фреймворком Arduino автоматически из
    ; board_build.f_cpu, но framework здесь framework-mik32v2-sdk, не
    ; arduino, поэтому макрос не определяется сам — нужно вручную, значение
    ; совпадает с board_build.f_cpu ниже.
    -D F_CPU=32000000UL
    -I lib/mik32_arduino_core/src/cores/arduino
    -I lib/mik32_arduino_core/src/variants/rex_board
    -I lib/mik32_arduino_core/src/cores/arduino/avr
    -I ~/.platformio/packages/framework-mik32v2-sdk/shared/libs
    -I ~/.platformio/packages/framework-mik32v2-sdk/hal/peripherals/Include
    -I ~/.platformio/packages/framework-mik32v2-sdk/hal/core/Include
    -I ~/.platformio/packages/framework-mik32v2-sdk/hal/utilities/Include
